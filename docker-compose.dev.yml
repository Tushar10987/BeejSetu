version: '3.8'

services:
  # Backend API
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://oilseeds:oilseeds123@postgres:5432/oilseeds_dev
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=dev-secret-key
    volumes:
      - ./apps/backend:/app
      - /app/node_modules
    depends_on:
      - postgres
      - redis
    networks:
      - oilseeds-network

  # Frontend React App
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:3001
      - REACT_APP_MAPBOX_TOKEN=${MAPBOX_TOKEN:-pk.eyJ1IjoibWFwYm94IiwiYSI6ImNpejY4NXVycTA2emYycXBndHRqcmZ3N3gifQ.rJcFIG214AriISLbB6B5aw}
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - oilseeds-network

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=oilseeds_dev
      - POSTGRES_USER=oilseeds
      - POSTGRES_PASSWORD=oilseeds123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - oilseeds-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - oilseeds-network

  # ML Service (Python/FastAPI)
  ml-service:
    build:
      context: ./apps/ml-service
      dockerfile: Dockerfile.dev
    ports:
      - "3002:3002"
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://oilseeds:oilseeds123@postgres:5432/oilseeds_dev
    volumes:
      - ./apps/ml-service:/app
    depends_on:
      - postgres
    networks:
      - oilseeds-network

volumes:
  postgres_data:
  redis_data:

networks:
  oilseeds-network:
    driver: bridge
